# Ponytail X bundle patch.
#
# Shape follows the verified entry-list schema (dsh --dump-config-schema;
# cf. @deepseek-ai/dsh-experimental-inspector):
#   - insert the policy service (the plugin entry; Cordis Service pattern,
#     same insertion shape as dsh-500-ai-agent / fable-5-1 in the web profile);
#   - insert an isolated skill-filesystem instance for the six skills.
#
# The skills directory is resolved from this package's own location through
# createRequire(baseUrl), the same portable pattern the dsh-agent-preset base
# layer uses, so the bundle stays relocatable (no absolute install paths).

- insert:
    - id: ponytail-x
      name: dsh-ponytail-x
      config:
        defaultMode: full
        injection:
          enabled: true
          maxChars: 1200
        complexity:
          ultraAt: 6
          liteAt: 1
        models:
          astra:
            provider: nine-router
            model: th/gpt-6-astra
          fable:
            provider: nine-router
            model: th/claude-fable-5.1
    - id: ponytail-x-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: ponytail-x
        includeDefaultRoots: false
        customSkillDirs:
          - !!js >-
            process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-ponytail-x/package.json')),
            'skills')
